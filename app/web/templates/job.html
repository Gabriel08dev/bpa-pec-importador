<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Processando</title>
  <link rel="stylesheet" href="/static/style.css?token={{ token }}">
</head>
<body class="process-page">
  <main class="process-layout">
    <section class="process-card">
      <div class="process-heading"><span class="spinner" aria-hidden="true"></span><div><p class="eyebrow">Operação protegida</p><h1>Processando</h1></div></div>
      <p id="message">Iniciando…</p>
      <ol id="progress"></ol>
    </section>
  </main>
  <script>const token={{ token|tojson }};const job={{ job_id|tojson }};async function poll(){const r=await fetch(`/api/trabalho/${job}?token=${encodeURIComponent(token)}`,{cache:'no-store'});const d=await r.json();document.getElementById('message').textContent=d.message;document.getElementById('progress').innerHTML=(d.progress||[]).map(x=>`<li>${x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</li>`).join('');if(d.status==='DONE'&&d.result&&d.result.redirect){location.href=d.result.redirect;return}if(d.status==='ERROR'){document.body.classList.add('error');return}setTimeout(poll,800)}poll();</script>
</body>
</html>
