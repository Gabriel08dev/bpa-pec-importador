<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Processando</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/job.js" defer></script>
</head>
<body class="process-page" data-job="{{ job_id }}">
  <main class="process-layout">
    <section class="process-card" aria-labelledby="process-title">
      <div class="process-heading"><span class="spinner" aria-hidden="true"></span><div><p class="eyebrow">Operação protegida</p><h1 id="process-title">Processando</h1></div></div>
      <p id="message" aria-live="polite">Iniciando…</p>
      <div class="progress-summary" id="progress-summary" aria-label="Resumo do processamento">
        <div><small>Página</small><strong id="summary-page">—</strong></div>
        <div><small>Analisados</small><strong id="summary-analyzed">0</strong></div>
        <div><small>Adicionados ao lote</small><strong id="summary-added">0</strong></div>
        <div><small>Ignorados</small><strong id="summary-ignored">0</strong></div>
      </div>
      <p class="last-warning" id="last-warning" role="status" aria-live="polite" hidden></p>
      <ol id="progress" aria-live="polite"></ol>
    </section>
  </main>
  <footer class="system-footer">
    <span class="system-footer__brand">BPA System &mdash; Desenvolvido por Gabriel da Silva Fonseca</span>
    <form class="session-logout" method="post" action="/sair"><button type="submit">Sair</button></form>
  </footer>
</body>
</html>
